name: check

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@v10
        with:
          hatchet-protocol: carve

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            lazy-trees = false
            eval-cores = 1
            fallback = true
            extra-substituters = https://nix-community.cachix.org https://noctalia.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=

      - uses: cachix/cachix-action@v17
        with:
          name: boatette
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: materialise pkgs.path
        run: |
          nix eval --raw .#nixosConfigurations --apply \
            'cs: builtins.concatStringsSep "\n" (map (c: "${c.pkgs.path}") (builtins.attrValues cs))'

      - run: nix flake check --no-build -L

      - name: evaluate checks
        run: |
          nix eval --json .#checks.x86_64-linux \
            --apply 'builtins.mapAttrs (_: c: { drv = c.drvPath; out = c.outPath; })' \
            > "$RUNNER_TEMP/checks.json"

      - name: build non-host checks
        run: |
          nix build -L --no-link --keep-going $(jq -r 'to_entries[] | select(.key | startswith("host-") | not)
            | "\(.value.drv)^*"' "$RUNNER_TEMP/checks.json")

      - name: build hosts
        run: |
          nix build -L --no-link --keep-going $(jq -r 'to_entries[] | select(.key | startswith("host-"))
            | "\(.value.drv)^*"' "$RUNNER_TEMP/checks.json")

      - name: push to cachix
        if: always()
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          [ -n "$CACHIX_AUTH_TOKEN" ] && [ -f "$RUNNER_TEMP/checks.json" ] || exit 0
          nix run .#cachix-push -- $(jq -r '.[].out' "$RUNNER_TEMP/checks.json")
