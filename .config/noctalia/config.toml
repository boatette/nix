[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.8
border_width = 1.0
capsule_radius = 0.0
capsule_thickness = 1.0
center = ["clock"]
end = ["tray", "network", "bluetooth", "volume", "notifications", "battery", "clipboard", "cat"]
font_family = "JetBrainsMono Nerd Font"
margin_edge = 10
margin_ends = 10
padding = 10
position = "left"
radius = 0
start = ["umbriel-companion", "workspaces", "media", "audio_visualizer"]
thickness = 32
widget_spacing = 12

[bar.default.dead_zone.actions]
scroll_down = "workspace-switch next"
scroll_up = "workspace-switch prev"

[brightness]
sync_all_monitors = true

[calendar]
enabled = true

[calendar.account.personal_google]
name = "Personal Calendar"
type = "google"

[control_center]
show_shortcut_labels = false
sidebar = "full"
sidebar_section = "none"
width = 800

[control_center.calendar]
show_week_numbers = true

[dock]
background_opacity = 0.8
border_width = 1.0
enabled = true
icon_size = 40
launcher_position = "start"
margin_edge = 10
pinned = ["foot", "org.qutebrowser.qutebrowser", "vesktop", "steam", "org.prismlauncher.PrismLauncher", "com.stremio.Stremio", "org.kde.dolphin"]
radius = 0
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = true

[hooks]
colors_changed = ["noctalia msg plugin boatette/auto-theme:auto-theme all colors-changed", "~/.local/bin/foot-apply-colours"]
theme_mode_changed = ["noctalia msg plugin boatette/auto-theme:auto-theme all theme-mode-changed"]
wallpaper_changed = ['noctalia msg plugin boatette/auto-theme:auto-theme all wallpaper-changed "$NOCTALIA_WALLPAPER_PATH"']

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 600.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 660.0

[keybinds]
down = ["Down", "Ctrl+j"]
left = ["Left", "Ctrl+h"]
right = ["Right", "Ctrl+l"]
tab_next = ["Tab", "Ctrl+n"]
tab_previous = ["Shift+ISO_Left_Tab", "Ctrl+p"]
up = ["Up", "Ctrl+k"]

[location]
auto_locate = true

[lockscreen]
allow_empty_password = false
blur_intensity = 0.7
enabled = true
fingerprint = true
lock_before_suspend = true
tint_intensity = 0.3

[notification]
background_opacity = 0.85
border = true

[osd]
background_opacity = 0.85
border = true
position = "bottom_center"
position_vertical = "center_left"

[plugin_settings."boatette/auto-theme"]
default_dynamic_scheme = "m3-content"

[plugin_settings."dotnetrob/cat"]
panel_placement = "floating"

[plugin_settings."noctalia/umbriel-companion"]
panel_placement = "floating"

[plugin_settings."noctalia/wallhaven"]
browser_placement = "floating"
browser_position = "top_center"
download_dir = "~/Pictures/Wallpapers/Dynamic"

[plugins]
enabled = ["dotnetrob/cat", "noctalia/wallhaven", "noctalia/umbriel-companion", "boatette/auto-theme"]

[[plugins.source]]
enabled = true
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
name = "official"

[[plugins.source]]
enabled = true
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
name = "community"

[[plugins.source]]
enabled = true
kind = "path"
location = "~/Projects/noctalia-plugins"
name = "Personal"

[shell]
app_icon_color = "primary"
app_icon_colorize = false
button_borders = true
card_borders = true
corner_radius_scale = 0.0
input_borders = true
launch_apps_as_systemd_services = true
password_style = "random"
polkit_agent = true
popup_borders = true
popup_shadows = false
screen_time_enabled = true
settings_window_translucent = true

[shell.greeter_sync]
auto_sync = true
privilege_command = "pkexec"

[shell.launcher]
app_grid = true
show_app_actions = true

[shell.launcher.providers.calculator]
prefix = "="

[shell.launcher.providers.emoji]
prefix = ":"

[shell.launcher.providers.wallpaper]
prefix = ""

[shell.launcher.providers.windows]
prefix = "@"

[shell.panel]
borders = true
clipboard_placement = "floating"
clipboard_position = "auto"
control_center_placement = "floating"
launcher_placement = "floating"
list_item_background = true
open_near_click_clipboard = true
open_near_click_control_center = true
session_placement = "floating"
session_position = "top_center"
transparency_mode = "soft"
wallpaper_placement = "floating"
wallpaper_position = "top_center"

[shell.screen_corners]
size = 36

[shell.screenshot]
confirm_region = true
directory = "~/Pictures/Screenshots"
filename_pattern = "Screenshot from %Y-%m-%d %H-%M-%S"
remember_last_region = true

[shell.session]
grid = true

[[shell.session.actions]]
action = "lock"
shortcut = "l"

[[shell.session.actions]]
action = "lock_and_suspend"
shortcut = "u"

[[shell.session.actions]]
action = "logout"
shortcut = "e"

[[shell.session.actions]]
action = "reboot"
shortcut = "r"

[[shell.session.actions]]
action = "shutdown"
shortcut = "s"
variant = "destructive"

[shell.shadow]
alpha = 0.0

[theme.templates]
builtin_ids = ["btop", "foot", "gtk3", "gtk4", "kcolorscheme", "qt", "umbriel"]
community_ids = ["claude-code", "discord", "gimp", "libreoffice", "papirus-icons", "prismlauncher", "steam", "zellij", "bat", "fzf", "lazygit", "yazi"]

[theme.templates.user.konsole]
input_path = "~/.config/noctalia/templates/konsole.colorscheme"
output_path = "~/.local/share/konsole/Noctalia.colorscheme"

[theme.templates.user.nvim]
input_path = "~/.config/noctalia/templates/nvim.lua"
output_path = "~/.config/nvim/noctalia.lua"
post_hook = "pkill -SIGUSR1 nvim"

[theme.templates.user.qutebrowser]
input_path = "~/.config/noctalia/templates/qutebrowser.py"
output_path = "~/.config/qutebrowser/noctalia/colors.py"
post_hook = "~/.local/bin/noctalia-qutebrowser-reload"

[theme.templates.user.selector]
input_path = "~/.config/noctalia/templates/selector.toml"
output_path = "~/.config/selector/noctalia.toml"
post_hook = "systemctl --user try-restart selector.service"

[wallpaper]
directory = "~/Pictures/Wallpapers"

[widget.battery]
hide_when_full = true
hide_when_plugged = true

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.launcher]
custom_image_colorize = true

[widget.media]
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.tray]
detached_panel = true
drawer = true

[widget.umbriel-companion]
type = "noctalia/umbriel-companion:bar"

[widget.volume]
show_label = false

[widget.workspaces]
style = "regular"
