"Mod+Up" = "window-focus-up"
"Mod+V" = "window-toggle-floating"
"Mod+W" = "spawn:qutebrowser"
"Mod+WheelDown" = "workspace-next"
"Mod+WheelLeft" = "window-focus-left"
