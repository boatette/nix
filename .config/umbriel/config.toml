"submap[passthrough],Mod+Escape" = "submap:reset"

[keybinds."Alt+XF86MonBrightnessDown"]
action = "spawn:noctalia msg brightness-down 1"
allow_when_locked = true

[keybinds."Alt+XF86MonBrightnessUp"]
action = "spawn:noctalia msg brightness-up 1"
allow_when_locked = true

[keybinds."Mod+Escape"]
action = "submap:passthrough"
repeat = false

[keybinds.XF86AudioLowerVolume]
action = "spawn:noctalia msg volume-down"
allow_when_locked = true

[keybinds.XF86AudioMicMute]
action = "spawn:noctalia msg mic-mute"
allow_when_locked = true

[keybinds.XF86AudioMute]
action = "spawn:noctalia msg volume-mute"
allow_when_locked = true

[keybinds.XF86AudioRaiseVolume]
action = "spawn:noctalia msg volume-up"
allow_when_locked = true

[keybinds.XF86MonBrightnessDown]
action = "spawn:noctalia msg brightness-down"
allow_when_locked = true

[keybinds.XF86MonBrightnessUp]
action = "spawn:noctalia msg brightness-up"
allow_when_locked = true

[[layer_rule]]
blur = false
blur_ignore_alpha = 0.05
blur_optimized = false

[layer_rule.match]
namespace = "^selector$"

[[layer_rule]]
blur = true
blur_ignore_alpha = 0.05
blur_popups = true

[layer_rule.match]
namespace = '^noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^"]*)$'

[[layer_rule]]
blur = true
blur_ignore_alpha = 0.05

[layer_rule.match]
namespace = "^noctalia-window-switcher$"

[layout]
gap = 10

[layout.scrolling]
default_extent_fraction = 0.5

[layout.struts]
left = 10
right = 10

[output.HDMI-A-1]
min_workspaces = 5
mode = "1920x1080@75.000"
position = [-1080, -420]
scale = 1.0
transform = "90"
workspace_axis = "horizontal"

[output.eDP-1]
min_workspaces = 5
mode = "1920x1080@144"
position = [0, 0]
scale = 1.0
transform = "normal"
workspace_axis = "vertical"

[[window_rule]]
blur = true

[[window_rule]]
default_floating = true

[window_rule.default_floating_size_px]
height = 1000
width = 800

[window_rule.match]
app_id = "^xdg-desktop-portal-gtk$"

[[window_rule]]
default_floating = true

[window_rule.match]
app_id = '^org\.gtk\.FileChooserDialog$'

[[window_rule]]
default_floating = true

[window_rule.match]
title = "Sign in - Google Accounts"

[[window_rule]]
default_floating = true

[window_rule.match]
app_id = '^(org\.kde\.dolphin|gimp|libreoffice|soffice)'
title = '^(Open|Save|Select|Import|Export|Rename|Properties|Preferences|Settings)\b'

[[window_rule]]
default_floating = true

[window_rule.match]
title = "^Picture-in-Picture$"

[[window_rule]]
default_maximize = true

[window_rule.match]
title = '^QEMU \('

[[window_rule]]
default_floating = true
default_pinned = true

[window_rule.default_floating_size_px]
height = 300
width = 900

[window_rule.default_position]
anchor = "bottom_right"
x = 0
y = 0

[window_rule.match]
app_id = "^qimgv$"
title = '\bdvp\.webp\b'

[[window_rule]]
default_maximize = true

[window_rule.match]
app_id = '^org\.qutebrowser\.qutebrowser$'

[[window_rule]]
default_floating = true

[window_rule.default_floating_size_px]
height = 920
width = 1080

[window_rule.match]
app_id = '^dev\.noctalia\.Noctalia$'

[[window_rule]]
default_floating = true

[window_rule.default_floating_size_px]
height = 600
width = 800

[window_rule.match]
app_id = '^dev\.noctalia\.UmbrielSharePicker$'

[[window_rule]]
default_floating = true

[window_rule.match]
app_id = "^steam(webhelper)?$"

[[window_rule]]
default_floating = false
default_maximize = true

[window_rule.match]
app_id = "^steam$"
title = "^Steam$"

[[window_rule]]
default_floating = false
default_fullscreen = true

[window_rule.match]
app_id = "^steam$"
title = "^Steam Big Picture Mode$"

[[window_rule]]
default_focused = false
default_pinned = true

[window_rule.default_position]
anchor = "bottom_right"
x = 10
y = 10

[window_rule.match]
app_id = "^steam$"
title = '^notificationtoasts_\d+_desktop$'

[[window_rule]]
default_maximize = true

[window_rule.match]
app_id = "vesktop|gimp|libreoffice"

[[window_rule]]
default_fullscreen = true

[window_rule.match]
app_id = "stremio"

