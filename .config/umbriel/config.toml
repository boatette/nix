[animation]
curve = "cinematic"
duration_ms = 195
enabled = true

[animation.beziers]
cinematic = [0.16, 0.84, 0.24, 1.0]
window_flow = [0.25, 0.46, 0.35, 1.0]
workspace_flow = [0.38, 0.0, 0.22, 1.0]

[animation.border]
enabled = false

[animation.layers]
curve = "easeoutcubic"
duration_ms = 175
enabled = true

[animation.overview]
curve = "cinematic"
duration_ms = 280
enabled = true

[animation.scratchpad]
blur = false
curve = "easeinoutcubic"
dim = 0.42
duration_ms = 215
enabled = true
fullscreen = false
maximize = false
scale = 0.0

[animation.springs.apparition]
damping = 0.7
stiffness = 240

[animation.windows_in]
curve = "apparition"
duration_ms = 205
enabled = true
scale = 0.72
style = "popin"

[animation.windows_move]
curve = "window_flow"
duration_ms = 195
enabled = true

[animation.windows_out]
curve = "easeoutcubic"
duration_ms = 165
enabled = true
style = "fade"

[animation.workspaces]
curve = "workspace_flow"
duration_ms = 225
enabled = true

[appearance]
border_width = 1
corner_radius = 0
outer_border_width = 0

[appearance.blur]
brightness = 0.9
contrast = 0.9
enabled = true
noise = 0.02
optimized = true
passes = 4
radius = 4
saturation = 1.1

[appearance.shadow]
enabled = false

[events]
lid_close = "noctalia msg session lock-and-suspend"

[general]
focus_on_activate = true
show_cheatsheet = false

[include.optional]
files = ["noctalia.toml"]

[input.cursor]
theme = "capitaine-cursors"

[input.keyboard]
layout = "us,us"
options = "caps:super,grp:win_space_toggle"
repeat_delay = 200
repeat_rate = 35
variant = ",dvp"

[input.touchpad]
natural_scroll = true

[keybinds]
"Alt+Tab" = "spawn:noctalia msg window-switcher"
"Ctrl+Shift+Escape" = "spawn:foot -e btop"
"Mod+0" = "workspace-switch:10"
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
