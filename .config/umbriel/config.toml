"Mod+9" = "workspace-switch:9"
"Mod+Alt+E" = 'spawn:foot zsh -ic "y; exec zsh"'
"Mod+Alt+Q" = """spawn:app_id=$(umbriel windows --json | jq -r 'first(.[] | select(.active) | .app_id) // empty'); [ -n "$app_id" ] && { pkill -9 -x "$app_id" || pkill -9 -f "$app_id"; }"""
"Mod+Alt+R" = "window-cycle-secondary-extent"
